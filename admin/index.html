<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<title>Portfolio Data Editor</title>
	<link rel="stylesheet" href="./editor.css">
</head>
<body>
	<header class="editor-header">
		<div>
			<p class="eyebrow">Portfolio Data Editor</p>
			<h1>ポートフォリオ更新ツール</h1>
		</div>
		<a href="../index.html" class="site-link">サイトへ戻る</a>
	</header>

	<main class="editor-shell">
		<section class="toolbar" aria-label="データ操作">
			<label>
				<span>言語</span>
				<select id="language-select">
					<option value="ja">日本語</option>
					<option value="en">English</option>
				</select>
			</label>
			<label>
				<span>データ</span>
				<select id="dataset-select">
					<option value="projects">Projects</option>
					<option value="skills">Skills</option>
					<option value="career">Career</option>
				</select>
			</label>
			<button id="load-button" type="button">読み込み</button>
			<label class="file-picker">
				<span>JSONを開く</span>
				<input id="file-input" type="file" accept="application/json,.json">
			</label>
			<button id="download-button" type="button">JSONを保存</button>
		</section>

		<section class="status-panel" aria-live="polite">
			<p id="status-message">データを読み込んでください。</p>
			<div id="validation-list"></div>
		</section>

		<section class="workspace">
			<aside class="entry-list-panel">
				<div class="panel-header">
					<h2>項目</h2>
					<button id="add-button" type="button">追加</button>
				</div>
				<div id="entry-list" class="entry-list"></div>
			</aside>

			<section class="form-panel">
				<div class="panel-header">
					<h2 id="form-title">編集フォーム</h2>
					<button id="delete-button" type="button" class="danger">削除</button>
				</div>
				<form id="editor-form" class="editor-form"></form>
			</section>
		</section>
	</main>

	<script type="module" src="./editor.js"></script>
</body>
</html>
